# Starting values from GDD 9 and 10.4. Integers only; the loader rejects anything else.

[layout]
width = 80
height = 40
leaf_min_w = 12
leaf_min_h = 9
max_depth = 5
early_stop_from_depth = 3
early_stop_pct = 15
split_long_axis_pct = 75
room_margin = 2
room_min = 5
room_max_w = 24
room_max_h = 12
cave_fill_pct = 35
cave_iterations = 3
cave_wall_neighbors = 5
cave_min_pct = 30
cave_tries = 4
door_pct = 60
rooms_min = 8
rooms_max = 14
max_attempts = 20
extra_links_base = 1
extra_links_level_div = 2

# Light radii are in tiles; costs are in ticks (100 ticks = 1 turn, GDD 7.1).
[play]
hard_hat_radius = 4
torch_radius = 8
move_cost = 100
door_cost = 100
wait_cost = 100
use_cost = 100
grave_fall_sides = 4
grave_climb_ticks = 200
torch_brine_one_in = 2
torch_crit_one_in = 4

# Combat rules that are numbers, not code (GDD 6.5, 7.4, 9.7).
[combat]
flank_bonus = 2
beast_bonus = 2
backstab_dice = 2
backstab_sides = 4
tracker_radius_sq = 25
spot_radius_sq = 9
passive_spot_one_in = 3

# How the monsters behave (GDD 7.6, 7.7). Ticks: 100 = one turn.
[ai]
wake_noise_one_in = 2
buried_rise_radius_sq = 9
eel_resubmerge_ticks = 200
eel_ambush_bonus = 4
badger_flee_pct = 40
badger_burrow_ticks = 1200
clock_in_pct = 35
phaser_wall_defense = 4
swarm_max = 3
aura_radius_sq = 25
aura_ticks = 300
overseer_min = 2
overseer_max = 3
trap_interval_ticks = 600
trap_sight_sq = 36
trapper_max_traps = 4
trapper_flee_ticks = 300
speech_hit_cooldown = 500

# How far a sound travels, in steps (GDD 7.7).
[noise]
melee = 5
door = 3
clang = 8

# The level's theme roll (GDD 9.4, 9.6).
[theme]
graveyard_pct = 30
grimsby_pct = 50

# Room types and what fills them (GDD 9.3, 10.4 step 4). The room-type odds are mine; the GDD
# leaves them open.
[features]
flood_min_pct = 30
level3_flooded_min = 2
level3_flooded_max = 3
collapse_pct = 50
bunk_pct = 20
rubble_pct = 25
cemetery_pct = 50
gravestone_pct = 12
grave_pct = 6
monuments = 2

# Rogue Human placement and speech (GDD 9.6).
[humans]
distance_pct = 50
last_level_distance_pct = 75
tic_one_in = 3
camp_traps = 2

# Threat budget is budget_base + budget_per_level * L (GDD 9.1); a monster costs its `threat`.
[spawns]
budget_base = 10
budget_per_level = 4
graveyard_budget_pct = 125
min_entry_distance = 80
room_cap = 6
asleep_pct = 35
bunk_asleep_pct = 80
grave_buried_pct = 50
pack_min = 3
pack_max = 5

[levels]
cavern_pct = [0, 20, 40, 60, 90]
trap_counts = [2, 3, 4, 5, 6]
