# -- consumables (GDD 8.2) ---------------------------------------------------------------------
# `price` is the list price in gold (found stock bills half, rounded up); `carry` the pack limit.
# effect "heal": `value` hit points. "light": burns for `value` ticks (400 turns). "status":
# applies `status` for `value` ticks.

[consumable.patch_up_kit]
name = "Patch-Up Kit"
price = 5
carry = 4
effect = "heal"
value = 10
status = ""

[consumable.torch]
name = "Torch"
price = 2
carry = 3
effect = "light"
value = 40000
status = ""

[consumable.overtime_fizz]
