# The Requisitions Desk catalog (GDD 8.5). `price` is paid from the wallet on the spot. Slot 1 of
# every desk is drawn from the bundles (by weight); the other slots from everything else. The
# weights are mine; the GDD gives none.
#
# effect: bundle        `qty` prepaid `item`s go in the pack (refused if they will not all fit)
#         weapon_dmg    +`value` damage on the main-hand weapon, at most `cap` in all
#         weapon_atk    +`value` ATK on the main-hand weapon, at most `cap` in all
#         plating       the body armor gets +`value` max Dur and +1 DR (once per armor)
#         item          `item` goes in the pack
#         max_hp        +`value` max HP, for good
#         repair_plan   the next armor repair line is halved
#         damage_waiver the next level's incidentals are waived, up to 6g
#         hazard_waiver the next level's Hazard Surcharge and Shoring Damage are waived

