# Saving, the title screen, and the menu (GDD 11).
title_name = "A  MINE  TOO  FAR"
title_tagline = "A Dungeonco Independent Contractor Experience"
title_continue = "[C] Continue    {class_name}, Work Order {number} of {total}, seed {seed}"
title_new = "[N] New run"
title_quit = "[Q] Quit"
title_confirm_new = "A saved run exists. A new run replaces it.   [Y] Replace it   [N] Keep it"
title_no_save = "No saved run on file."
title_records = "[R] Employment history"
help_title = "HELP"
help_text = """\
MOVING      arrows, numpad, or h j k l y u b n. Shift + a move
            key runs. Move into a monster to attack it, into a
            door to open it.
WAITING     Space, . or 5. Waiting does not heal.
ACTING      a  class ability       t  torch on or off
            g  pick up (or ,)      x  look around
PACK        i  look   e  equip   q  use   d  drop
SHEET       c  character sheet
DOWN SHAFT  Enter or >, standing on it, ends the level
SCREEN      F2  glyph set          Ctrl+L  redraw
MENU        Esc  save and quit     Shift+Q  quit now
HELP        ?  this screen

THE JOB
Reach the Down Shaft on each of five levels. Dungeonco pays a
flat fee and bills repairs, supplies and mishaps against it.
What is left goes in your wallet; a shortfall becomes debt,
and debt closes the Requisitions Desk. Score: wallet less
debt, plus 10 a level, 5 a bounty. Rogue Humans are optional."""
records_title = "EMPLOYMENT HISTORY"
records_none = "No runs on file."
records_entry = "{number:>2}. {class_name:<7} {score:>4} pts  {title:<23} {seed}"
