# Class definitions (GDD 6). Rank tables are indexed by Rank 1..5; attributes give the modifiers
# through (score - 10) // 2. An empty offhand means nothing in the Off Hand. Cumulative bonuses:
# rank_atk and rank_dmg already include every earlier Rank's bonus.

