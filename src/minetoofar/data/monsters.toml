# Base monster stats at Level 1 (GDD 7.6); level scaling is applied in code. `weight` and
# `grave_weight` are the spawn weights on a normal and a graveyard floor (GDD 9.4); `min_level` is
# level gating (Skeletons from 2, Wraiths from 3). Weight 0 means the spawner never draws it: the
# Rogue Humans are placed by their own stage. `behavior` picks the brain in sim/behaviors.py.

