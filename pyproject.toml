[project]
name = "minetoofar"
dynamic = ["version"]
description = "A Mine Too Far: a terminal dungeon crawler"
requires-python = ">=3.12"
dependencies = ["textual>=8.2,<9"]

[project.scripts]
minetoofar = "minetoofar.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/minetoofar/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/minetoofar"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
build = ["pyinstaller>=6.16,<7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: long fuzz runs (run with -m slow)"]
addopts = "-m 'not slow' -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src"]
